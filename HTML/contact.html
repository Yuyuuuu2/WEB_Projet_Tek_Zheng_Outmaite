
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../CSS/styles.css" rel="stylesheet">
    <title>Nous Contacter</title>
</head>
<script src="../JS/transition.js"></script>
<body class="jeux">

    <header class="banniere">
        <a href="accueil.html" class="logo">
            <img src="../Images/logo.png" alt="Logo du site">
        </a>

        <nav class="navigation">
            <ul>
                <li><a href="accueil.html">Accueil</a></li>
                <li><a href="jeux.html">Jeux</a></li>
                <li><a href="about.html">Gizmo</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Nous Contacter</h1>

        <form class="formulaire-contact" id="form-contact">

            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>

            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" name="email" placeholder="exemple@email.com" required>

            <label for="sexe">Sexe :</label>
            <select id="sexe" name="sexe" required>
                <option value="">Choisissez une option</option>
                <option value="Homme">Homme</option>
                <option value="Femme">Femme</option>
                <option value="Autre">Autre</option>
            </select>

            <label for="age">Âge :</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="Votre âge" required>

            <label for="question">Votre question :</label>
            <textarea id="question" name="question" rows="6" placeholder="Écrivez votre question ici..." required></textarea>

            <button class = "jeux" type="submit">Envoyer</button>

        </form>

        <p id="message-confirmation"></p>

    </main>

    <footer>
        <p>© 2026 Tek Zheng Outmaite. Tous droits réservés.</p>
    </footer>

    <script src="../JS/contact.js"></script>

</body>
</html>
